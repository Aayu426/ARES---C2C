; ARES node firmware. One codebase, four builds.
;
;   pio run -e nodeA            -t upload --upload-port COM3     honest node A  (PIR + temp + alarm)
;   pio run -e nodeA_malicious  -t upload --upload-port COM3     node A that lies on command
;   pio run -e nodeB            -t upload --upload-port COM4     honest node B  (water)
;   pio run -e nodeB_malicious  -t upload --upload-port COM4     node B that lies on command
;
; Keys live in include/secrets.h (git-ignored). Generate it from the gateway's
; keys.json with:  python make_secrets.py

[platformio]
default_envs = nodeA

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = direct
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
build_flags = -DCORE_DEBUG_LEVEL=0

[env:nodeA]
build_flags = ${env.build_flags} -DNODE_A -DHAS_PIR -DHAS_TEMP -DHAS_ALARM -DHAS_STATUS_LEDS

[env:nodeA_malicious]
build_flags = ${env:nodeA.build_flags} -DMALICIOUS

[env:nodeB]
build_flags = ${env.build_flags} -DNODE_B -DHAS_WATER -DHAS_STATUS_LEDS

[env:nodeB_malicious]
build_flags = ${env:nodeB.build_flags} -DMALICIOUS
