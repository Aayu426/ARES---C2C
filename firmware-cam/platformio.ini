; ARES camera node — OV7670 on a plain ESP32 WROOM-32 (no PSRAM).
; Streams MJPEG over WiFi at http://<ip>:81/stream ; the laptop vision service reads it.
;
;   pio run -t upload --upload-port COM5
;   pio device monitor -p COM5 -b 115200   (prints the IP after it joins the hotspot)

[env:cam]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0
